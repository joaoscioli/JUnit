name: Java CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run testing lab checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test
